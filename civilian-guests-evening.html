<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Download Receipt</title>
<style>
  body{font-family:Arial,sans-serif;max-width:520px;margin:32px auto;padding:0 16px;text-align:center;color:#222}
  button,#download{display:block;width:100%;box-sizing:border-box;margin:14px 0;padding:16px;background:#1a73e8;color:#fff;border:0;border-radius:8px;font-size:18px;text-decoration:none;cursor:pointer}
  button:disabled{background:#aaa;cursor:default}
  #msg{color:#555;min-height:24px}
  #preview{margin-top:24px}
  #receipt-image{max-width:100%;height:auto;border:1px solid #ddd;border-radius:8px}
  #download{background:#188038}
</style>
</head>
<body>
<h1 id="title"></h1>
<p>Select your receipt:</p>
<div id="receipts"></div>
<p id="msg"></p>
<section id="preview" hidden>
  <img id="receipt-image" alt="Selected receipt">
  <a id="download">Download receipt</a>
</section>
<script>var RECEIPT_PAGE = {title:"Civilian Guests - Evening",receipts:[{label:"Receipt of Rs 300",file:"Civilian_300_Evening.jpg",saveAs:"Civilian Receipt Rs 300 - Evening.jpg"}]};</script>
<script src="receipt-page.js"></script>
</body>
</html>
