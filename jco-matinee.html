<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSA Receipt</title>
<style>
  :root{background:#fff4e6}
  *{box-sizing:border-box}
  body{font-family:Arial,sans-serif;max-width:560px;margin:0 auto;padding:20px 16px 40px;text-align:center;color:#222;background:#fff4e6}
  .site-header{margin-bottom:26px}
  .brand{display:flex;align-items:center;justify-content:center;gap:clamp(5px,2vw,14px);width:100%}
  .brand-logo{width:clamp(34px,10vw,64px);height:auto;aspect-ratio:1;object-fit:contain;flex:0 0 clamp(34px,10vw,64px)}
  .brand h1{margin:0;font-size:clamp(.62rem,4.4vw,2rem);white-space:nowrap;flex:0 1 auto;line-height:1.1;color:#8f1717;letter-spacing:.02em}
  #title{margin:20px 0 8px;font-size:clamp(1.35rem,5vw,2rem);line-height:1.2}
  .instruction{margin:0 0 18px;font-size:1rem}
  button{display:block;width:100%;margin:14px 0;padding:16px;background:#1a73e8;color:#fff;border:0;border-radius:8px;font-size:18px;text-decoration:none;cursor:pointer}
  button:disabled{background:#aaa;cursor:default}
</style>
</head>
<body>
<header class="site-header">
  <div class="brand">
    <img class="brand-logo" src="SWC-transparent.png?v=2" alt="SWC logo">
    <h1>SAPTA SHAKTI AUDITORIUM</h1>
    <img class="brand-logo" src="SWC-transparent.png?v=2" alt="SWC logo">
  </div>
</header>
<p class="instruction">Please download the receipt as per your payment.</p>
<div id="receipts"></div>
<script>var RECEIPT_PAGE = {title:"JCOs / ORs - Matinee",receipts:[{label:"Receipt of Rs 60",file:"JCO_60_Matinee.jpg",saveAs:"JCO Receipt Rs 60 - Matinee.jpg"},{label:"Receipt of Rs 120",file:"JCO_120_Matinee.jpg",saveAs:"JCO Receipt Rs 120 - Matinee.jpg"}]};</script>
<script src="receipt-page.js"></script>
</body>
</html>
