<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSA Receipt</title>
<style>
  :root{background:#fff4e6}
  *{box-sizing:border-box}
  body{font-family:Arial,sans-serif;max-width:560px;margin:0 auto;padding:20px 16px 40px;text-align:center;color:#222;background:#fff4e6}
  .site-header{margin-bottom:26px}
  .brand{display:grid;grid-template-columns:clamp(38px,11vw,72px) 1fr clamp(38px,11vw,72px);align-items:center;gap:clamp(8px,2.5vw,18px)}
  .brand-logo{width:100%;height:auto;aspect-ratio:1;object-fit:contain}
  .brand h1{margin:0;font-size:clamp(1.05rem,5vw,2rem);line-height:1.1;color:#8f1717;letter-spacing:.02em}
  #title{margin:20px 0 8px;font-size:clamp(1.35rem,5vw,2rem);line-height:1.2}
  .instruction{margin:0 0 18px;font-size:1rem}
  button,#download{display:block;width:100%;margin:14px 0;padding:16px;background:#1a73e8;color:#fff;border:0;border-radius:8px;font-size:18px;text-decoration:none;cursor:pointer}
  button:disabled{background:#aaa;cursor:default}
  #msg{color:#555;min-height:24px}
  #preview{margin-top:24px}
  #receipt-image{max-width:100%;height:auto;border:1px solid #d5bfa8;border-radius:8px}
  #download{background:#188038}
</style>
</head>
<body>
<header class="site-header">
  <div class="brand">
    <img class="brand-logo" src="SWC-transparent.png?v=2" alt="SWC logo">
    <h1>SAPTA SHAKTI AUDITORIUM</h1>
    <img class="brand-logo" src="SWC-transparent.png?v=2" alt="SWC logo">
  </div>
</header>
<h2 id="title"></h2>
<p class="instruction">Select your receipt:</p>
<div id="receipts"></div>
<p id="msg"></p>
<section id="preview" hidden>
  <img id="receipt-image" alt="Selected receipt">
  <a id="download">Download receipt</a>
</section>
<script>var RECEIPT_PAGE = {title:"Civilian Guests - Matinee",receipts:[{label:"Receipt of Rs 300",file:"Civilian_300_Matinee.jpg",saveAs:"Civilian Receipt Rs 300 - Matinee.jpg"}]};</script>
<script src="receipt-page.js"></script>
</body>
</html>
